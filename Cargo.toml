[package]
name = "bcos-lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
x-com-lib = {path="../xComRustLib"}
zeroize = "1.6.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
parity-crypto = "0.9.0"
secp256k1 = { version = "0.28.0", features = ["recovery"]}
hex = "0.4.3"
rlp = "0.5.2"
ethabi = "18.0.0"
hyper = {version = "0.14.27", features = ["full"] }
hyper-rustls = "0.24.2"
rustls = {version = "0.21.8", features = ["dangerous_configuration"]}
rustls-pemfile = "1.0.3"
byteorder = "1.5.0"
rand = "0.9.1"

# web3 =  "0.19.0"